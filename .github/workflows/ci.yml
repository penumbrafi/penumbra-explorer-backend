# fmt, clippy and tests on pull requests and pushes to main.
#
# Runs in a Debian bookworm container so the toolchain and system libraries
# match CT1105, the deployment target.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    container: rust:1.89-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libpq-dev clang libclang-dev cmake

      - name: install toolchain components
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      # TODO: restore `-- -D warnings` once the 12 lints `main` currently
      # carries (map_or, large_enum_variant, regex-in-loop, an unused enum,
      # ...) have been cleaned up in their own PR. Denying them here would
      # block every PR on debt this change did not create; the previous
      # pipeline set `-W clippy::pedantic -D warnings` but ran on runners this
      # org does not have, so it never actually executed.
      - run: cargo clippy --all-targets --all-features --workspace
      - run: cargo test --all
