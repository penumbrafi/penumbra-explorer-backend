# fmt, clippy and tests on pull requests and pushes to main.
#
# Runs in a Debian bookworm container so the toolchain and system libraries
# match CT1105, the deployment target.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    container: rust:1.89-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libpq-dev clang libclang-dev cmake

      - name: install toolchain components
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --workspace -- -D warnings
      - run: cargo test --all
